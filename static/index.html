<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Science Diagram Maker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Science Diagram Maker</h1>
    <p>AI-generated animated science diagrams, checked by code.</p>
  </header>

  <main>
    <div id="error-banner" class="error" hidden></div>
    <p id="loading">Loading results…</p>

    <div class="table-wrap">
      <table id="results-table" hidden>
        <thead>
          <tr>
            <th>Concept</th>
            <th>Diagram</th>
            <th>Checks</th>
            <th>Cost (estimate)</th>
            <th>Retries</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
